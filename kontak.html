<!-- JUDUL HALAMAN -->
<header class="hero detail-hero">
  <div class="container">
    <h1 class="display-5 fw-bold">Kontak</h1>
    <p class="lead mt-3">Tertarik bekerja sama atau ingin bertanya? Hubungi saya.</p>
  </div>
</header>

<section>
  <div class="container">
    <div class="row g-4">
      <div class="col-lg-5">
        <p class="fs-5">Kirim pesan lewat formulir atau hubungi saya langsung.</p>
        <a class="btn btn-outline-dark me-2 mb-2" href="https://github.com/username" target="_blank" rel="noopener">GitHub</a>
        <a class="btn btn-outline-dark me-2 mb-2" href="https://linkedin.com/in/adi wiraguna" target="_blank" rel="noopener">LinkedIn</a>
        <a class="btn btn-outline-dark mb-2" href="https://instagram.com/adi.wiraguna.3388" target="_blank" rel="noopener">Instagram</a>
      </div>
      <div class="col-lg-7">
        <form action="mailto:nama@email.com" method="post" enctype="text/plain">
          <div class="mb-3">
            <label for="nama" class="form-label">Nama</label>
            <input type="text" class="form-control" id="nama" name="nama" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>
          <div class="mb-3">
            <label for="pesan" class="form-label">Pesan</label>
            <textarea class="form-control" id="pesan" name="pesan" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn btn-teal">Kirim pesan</button>
        </form>
      </div>
    </div>
  </div>
</section>
